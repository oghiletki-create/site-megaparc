<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2a78d6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GO CRM">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>GO CRM — Panou analitic</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-warn: #b8500f;
  --delta-good: #006300;
  --funnel-1: #86b6ef;
  --funnel-2: #5598e7;
  --funnel-3: #2a78d6;
  --funnel-4: #1c5cab;
  --funnel-5: #104281;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface-1: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-warn: #e0762f;
    --delta-good: #0ca30c;
    --funnel-1: #184f95;
    --funnel-2: #256abf;
    --funnel-3: #3987e5;
    --funnel-4: #6da7ec;
    --funnel-5: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface-1: #1a1a19;
  --text-primary: #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted: #898781;
  --grid: #2c2c2a;
  --baseline: #383835;
  --border: rgba(255,255,255,0.10);
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-warn: #e0762f;
  --delta-good: #0ca30c;
  --funnel-1: #184f95;
  --funnel-2: #256abf;
  --funnel-3: #3987e5;
  --funnel-4: #6da7ec;
  --funnel-5: #9ec5f4;
}
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--page);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: 24px;
}
.wrap { max-width: 1080px; margin: 0 auto; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
h1 { font-size: 22px; font-weight: 700; }
.badge {
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
  padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border);
  color: var(--text-secondary); background: var(--surface-1);
}
.badge.live { color: var(--delta-good); border-color: currentColor; }
.sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 14px; }
.btn {
  cursor: pointer; font-size: 13px;
  background: var(--surface-1); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px;
}
.btn.accent { color: var(--series-1); border-color: currentColor; font-weight: 600; }
nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
nav a {
  font-size: 12px; text-decoration: none; padding: 5px 10px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
}
nav a:hover { color: var(--text-primary); border-color: var(--baseline); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 18px; min-width: 0; scroll-margin-top: 16px;
}
.card.wide { grid-column: 1 / -1; }
.card h2 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.card .path { font-size: 11px; color: var(--series-1); margin-bottom: 2px; font-weight: 600; }
.card .hint { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { background: var(--page); border: 1px solid var(--grid); border-radius: 10px; padding: 12px 14px; }
.tile .label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
.tile .value { font-size: 24px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .unit { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-left: 2px; }
.tile .note { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
svg { display: block; width: 100%; height: auto; }
svg text { font-family: inherit; }
.tick { font-size: 10px; fill: var(--text-muted); font-variant-numeric: tabular-nums; }
.dlabel { font-size: 11px; font-weight: 600; fill: var(--text-primary); font-variant-numeric: tabular-nums; }
.blabel { font-size: 11px; fill: var(--text-secondary); }
details { margin-top: 10px; }
summary { font-size: 12px; color: var(--text-muted); cursor: pointer; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
th { text-align: left; color: var(--text-secondary); font-weight: 600; white-space: nowrap; }
td { font-variant-numeric: tabular-nums; }
th, td { padding: 4px 8px 4px 0; border-bottom: 1px solid var(--grid); }
td:last-child, th:last-child { text-align: right; }
.empty { color: var(--text-muted); font-size: 13px; padding: 24px 0; text-align: center; }
#tooltip {
  position: fixed; pointer-events: none; z-index: 10; display: none;
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.15); white-space: nowrap;
}
#tooltip b { font-variant-numeric: tabular-nums; }
@media (max-width: 720px) { .grid { grid-template-columns: 1fr; } body { padding: 16px; } }
@media (display-mode: standalone) { body { padding-top: 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">GO CRM — Panou analitic</h1>
    <span id="badge" class="badge">…</span>
    <button id="install" class="btn accent" type="button" hidden>⊕ Instalează</button>
    <button id="refresh-now" class="btn" type="button" style="margin-left:auto">↻</button>
    <button id="lang" class="btn" type="button">Русский</button>
    <button id="theme" class="btn" type="button">Temă: auto</button>
  </header>
  <p class="sub" id="sub"></p>
  <nav id="nav"></nav>
  <div class="grid" id="sections"></div>
</div>
<div id="tooltip"></div>

<script>
const STR = {
  ro: {
    title: 'GO CRM — Panou analitic',
    loading: 'SE ÎNCARCĂ…',
    live: 'DATE LIVE',
    demo: 'DEMO · date exemplu',
    offline: 'FĂRĂ CONEXIUNE · ultimele date',
    sub: 'Raportare live din CRM-ul din Telegram · exact modulele active în meniu',
    updated: 'actualizat',
    auto: 'reîmprospătare automată la {s} s',
    langBtn: 'Русский',
    themeAuto: 'Temă: auto', themeLight: 'Temă: luminoasă', themeDark: 'Temă: întunecată',
    install: '⊕ Instalează pe desktop',
    seeTable: 'Vezi tabelul',
    empty: 'Niciun modul activ în meniul botului. Activează un modul în Telegram și panoul îl afișează automat.',
    min: 'min', days: 'zile'
  },
  ru: {
    title: 'GO CRM — Аналитическая панель',
    loading: 'ЗАГРУЗКА…',
    live: 'ЖИВЫЕ ДАННЫЕ',
    demo: 'ДЕМО · примерные данные',
    offline: 'НЕТ СВЯЗИ · последние данные',
    sub: 'Живая отчётность из CRM в Telegram · ровно те модули, что активны в меню',
    updated: 'обновлено',
    auto: 'автообновление каждые {s} с',
    langBtn: 'Română',
    themeAuto: 'Тема: авто', themeLight: 'Тема: светлая', themeDark: 'Тема: тёмная',
    install: '⊕ Установить на рабочий стол',
    seeTable: 'Показать таблицу',
    empty: 'В меню бота нет активных модулей. Включите модуль в Telegram — панель покажет его автоматически.',
    min: 'мин', days: 'дн.'
  }
}

const MONTHS_BY_LANG = {
  ro: ['ian', 'feb', 'mar', 'apr', 'mai', 'iun', 'iul', 'aug', 'sep', 'oct', 'nov', 'dec'],
  ru: ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек']
}

const params = new URLSearchParams(location.search)
const urlLang = params.get('lang')
let LANG = urlLang === 'ru' || urlLang === 'ro' ? urlLang : null
if (!LANG) { try { LANG = localStorage.getItem('gocrm_lang') } catch {} }
if (LANG !== 'ru') LANG = 'ro'

const t = k => (STR[LANG] && STR[LANG][k]) || STR.ro[k] || k
const loc = o => o == null ? '' : (typeof o === 'string' ? o : (o[LANG] || o.ro || ''))
const locale = () => LANG === 'ru' ? 'ru-RU' : 'ro-RO'
let nf = new Intl.NumberFormat(locale())

let lastKpi = null
let lastLive = false
let lastGoodAt = null
let CURRENCY = 'EUR'

const tooltip = document.getElementById('tooltip')

function fmtDay(iso) {
  const d = new Date(iso + 'T00:00:00Z')
  return d.getUTCDate() + ' ' + MONTHS_BY_LANG[LANG][d.getUTCMonth()]
}

function fmtMonth(ym) {
  const [y, m] = String(ym).split('-')
  return MONTHS_BY_LANG[LANG][+m - 1] + ' ' + y
}

function fmtK(v) {
  return Math.abs(v) >= 1000 ? nf.format(+(v / 1000).toFixed(1)) + 'k' : nf.format(v)
}

function fmtValue(v, fmt) {
  if (v == null) return '—'
  if (fmt === 'money') return nf.format(Math.round(v))
  if (fmt === 'pct') return nf.format(v) + '%'
  if (fmt === 'min') return nf.format(v) + ' ' + t('min')
  if (fmt === 'days') return nf.format(v) + ' ' + t('days')
  return nf.format(v)
}

function unitOf(fmt) {
  return fmt === 'money' ? CURRENCY : fmt === 'pct' ? '%' : ''
}

function niceMax(v) {
  if (v <= 0) return 1
  const pow = Math.pow(10, Math.floor(Math.log10(v)))
  const n = v / pow
  const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10
  return step * pow
}

function showTip(html, x, y) {
  tooltip.innerHTML = html
  tooltip.style.display = 'block'
  const r = tooltip.getBoundingClientRect()
  tooltip.style.left = Math.min(x + 14, window.innerWidth - r.width - 8) + 'px'
  tooltip.style.top = Math.max(8, y - r.height - 12) + 'px'
}

function hideTip() { tooltip.style.display = 'none' }

function el(name, attrs, text) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', name)
  for (const k in attrs) node.setAttribute(k, attrs[k])
  if (text != null) node.textContent = text
  return node
}

function roundedTop(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h)
  return `M${x},${y + h} V${y + rr} Q${x},${y} ${x + rr},${y} H${x + w - rr} Q${x + w},${y} ${x + w},${y + rr} V${y + h} Z`
}

function roundedRight(x, y, w, h, r) {
  const rr = Math.min(r, h / 2, w)
  return `M${x},${y} H${x + w - rr} Q${x + w},${y} ${x + w},${y + rr} V${y + h - rr} Q${x + w},${y + h} ${x + w - rr},${y + h} H${x} Z`
}

function colorOf(chart) {
  if (chart.color === 'alt') return 'var(--series-2)'
  if (chart.color === 'warn') return 'var(--series-warn)'
  return 'var(--series-1)'
}

function cellText(cell) {
  if (cell == null) return '—'
  if (typeof cell === 'number') return nf.format(cell)
  if (typeof cell === 'string') return cell
  if (cell.month) return fmtMonth(cell.month)
  if (cell.day) return fmtDay(cell.day)
  if (cell.v !== undefined) return fmtValue(cell.v, cell.fmt)
  return loc(cell)
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
}

function renderTable(host, table) {
  if (!table || !table.rows.length) return
  const details = document.createElement('details')
  const summary = document.createElement('summary')
  summary.textContent = t('seeTable')
  const box = document.createElement('div')
  box.className = 'scroll'
  box.innerHTML =
    '<table><thead><tr>' + table.head.map(h => `<th>${escapeHtml(loc(h))}</th>`).join('') + '</tr></thead><tbody>' +
    table.rows.map(r => '<tr>' + r.map(c => `<td>${escapeHtml(cellText(c))}</td>`).join('') + '</tr>').join('') +
    '</tbody></table>'
  details.append(summary, box)
  host.appendChild(details)
}

function renderTiles(host, tiles) {
  if (!tiles || !tiles.length) return
  const box = document.createElement('div')
  box.className = 'tiles'
  box.innerHTML = tiles.map(i => {
    const unit = unitOf(i.fmt)
    const value = i.value == null ? '—'
      : i.fmt === 'min' || i.fmt === 'days' ? fmtValue(i.value, i.fmt)
      : i.fmt === 'money' ? nf.format(Math.round(i.value))
      : nf.format(i.value)
    const showUnit = unit && i.value != null ? `<span class="unit">${unit}</span>` : ''
    const note = i.note ? `<div class="note">${escapeHtml(loc(i.note))}</div>` : ''
    return `<div class="tile"><div class="label">${escapeHtml(loc(i.label))}</div><div class="value">${value}${showUnit}</div>${note}</div>`
  }).join('')
  host.appendChild(box)
}

function renderLine(host, chart) {
  const rows = chart.rows
  const W = 960, H = 220, padL = 34, padR = 16, padT = 20, padB = 26
  const iw = W - padL - padR, ih = H - padT - padB
  const max = niceMax(Math.max(...rows.map(r => r.value)))
  const x = i => padL + (rows.length > 1 ? i / (rows.length - 1) * iw : iw / 2)
  const y = v => padT + ih - v / max * ih
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' })
  for (let g = 0; g <= 4; g++) {
    const gy = padT + ih - g / 4 * ih
    svg.appendChild(el('line', { x1: padL, x2: W - padR, y1: gy, y2: gy, stroke: g === 0 ? 'var(--baseline)' : 'var(--grid)', 'stroke-width': 1 }))
    svg.appendChild(el('text', { x: padL - 6, y: gy + 3, 'text-anchor': 'end', class: 'tick' }, nf.format(max * g / 4)))
  }
  rows.forEach((r, i) => {
    if (i === rows.length - 1 || (i % 7 === 0 && i < rows.length - 3)) {
      svg.appendChild(el('text', { x: x(i), y: H - 8, 'text-anchor': 'middle', class: 'tick' }, fmtDay(r.key)))
    }
  })
  svg.appendChild(el('polyline', {
    points: rows.map((r, i) => `${x(i)},${y(r.value)}`).join(' '),
    fill: 'none', stroke: colorOf(chart), 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'
  }))
  const maxIdx = rows.reduce((best, r, i) => r.value > rows[best].value ? i : best, 0)
  svg.appendChild(el('circle', { cx: x(maxIdx), cy: y(rows[maxIdx].value), r: 4, fill: colorOf(chart), stroke: 'var(--surface-1)', 'stroke-width': 2 }))
  svg.appendChild(el('text', { x: x(maxIdx), y: y(rows[maxIdx].value) - 10, 'text-anchor': 'middle', class: 'dlabel' }, nf.format(rows[maxIdx].value)))
  const cross = el('line', { y1: padT, y2: padT + ih, stroke: 'var(--baseline)', 'stroke-width': 1, 'stroke-dasharray': '3 3', visibility: 'hidden' })
  const dot = el('circle', { r: 4, fill: colorOf(chart), stroke: 'var(--surface-1)', 'stroke-width': 2, visibility: 'hidden' })
  svg.append(cross, dot)
  const hover = el('rect', { x: padL, y: padT, width: iw, height: ih, fill: 'transparent' })
  hover.addEventListener('mousemove', ev => {
    const rect = svg.getBoundingClientRect()
    const mx = (ev.clientX - rect.left) / rect.width * W
    const i = Math.max(0, Math.min(rows.length - 1, Math.round((mx - padL) / iw * (rows.length - 1))))
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible')
    dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(rows[i].value)); dot.setAttribute('visibility', 'visible')
    showTip(`${fmtDay(rows[i].key)}: <b>${nf.format(rows[i].value)}</b>`, ev.clientX, ev.clientY)
  })
  hover.addEventListener('mouseleave', () => {
    cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); hideTip()
  })
  svg.appendChild(hover)
  host.appendChild(svg)
}

function renderBarsV(host, chart) {
  const rows = chart.rows
  const W = 460, H = 220, padL = 52, padR = 10, padT = 22, padB = 26
  const iw = W - padL - padR, ih = H - padT - padB
  const max = niceMax(Math.max(...rows.map(r => r.value)))
  const slot = iw / rows.length
  const bw = Math.min(46, slot - 8)
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' })
  for (let g = 0; g <= 4; g++) {
    const gy = padT + ih - g / 4 * ih
    svg.appendChild(el('line', { x1: padL, x2: W - padR, y1: gy, y2: gy, stroke: g === 0 ? 'var(--baseline)' : 'var(--grid)', 'stroke-width': 1 }))
    svg.appendChild(el('text', { x: padL - 6, y: gy + 3, 'text-anchor': 'end', class: 'tick' }, fmtK(max * g / 4)))
  }
  const maxIdx = rows.reduce((best, r, i) => r.value > rows[best].value ? i : best, 0)
  rows.forEach((r, i) => {
    const h = Math.max(2, r.value / max * ih)
    const x0 = padL + i * slot + (slot - bw) / 2
    const y0 = padT + ih - h
    const p = el('path', { d: roundedTop(x0, y0, bw, h, 4), fill: colorOf(chart) })
    p.addEventListener('mousemove', ev => showTip(`${fmtMonth(r.key)}: <b>${fmtValue(r.value, chart.fmt)}</b> ${unitOf(chart.fmt)}`, ev.clientX, ev.clientY))
    p.addEventListener('mouseleave', hideTip)
    svg.appendChild(p)
    svg.appendChild(el('text', { x: x0 + bw / 2, y: H - 8, 'text-anchor': 'middle', class: 'tick' }, fmtMonth(r.key).split(' ')[0]))
    if (i === maxIdx) svg.appendChild(el('text', { x: x0 + bw / 2, y: y0 - 6, 'text-anchor': 'middle', class: 'dlabel' }, fmtK(r.value)))
  })
  host.appendChild(svg)
}

function renderBarsH(host, chart, wide) {
  const rows = chart.rows
  const W = wide ? 960 : 470
  const labelW = wide ? 170 : 118
  const valueW = wide ? 90 : 62
  const maxChars = wide ? 26 : 16
  const rowH = wide ? 26 : 22, gap = wide ? 8 : 7, padT = 4
  const H = padT + rows.length * (rowH + gap)
  const max = Math.max(...rows.map(r => r.value), 1)
  const iw = W - labelW - valueW
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' })
  rows.forEach((r, i) => {
    const y0 = padT + i * (rowH + gap)
    const w = Math.max(4, r.value / max * iw)
    const text = loc(r.label)
    const p = el('path', { d: roundedRight(labelW, y0, w, rowH, 4), fill: colorOf(chart) })
    p.addEventListener('mousemove', ev => showTip(`${escapeHtml(text)}: <b>${fmtValue(r.value, chart.fmt)}</b> ${unitOf(chart.fmt)}`, ev.clientX, ev.clientY))
    p.addEventListener('mouseleave', hideTip)
    svg.appendChild(p)
    svg.appendChild(el('text', { x: labelW - 8, y: y0 + rowH / 2 + 4, 'text-anchor': 'end', class: 'blabel' },
      text.length > maxChars ? text.slice(0, maxChars - 1) + '…' : text))
    svg.appendChild(el('text', { x: labelW + w + 8, y: y0 + rowH / 2 + 4, class: 'dlabel' },
      chart.fmt === 'money' ? fmtK(r.value) : fmtValue(r.value, chart.fmt)))
  })
  host.appendChild(svg)
}

function renderFunnel(host, chart) {
  const rows = chart.rows
  const W = 460, rowH = 34, gap = 10, padT = 4, labelW = 140
  const H = padT + rows.length * (rowH + gap)
  const max = rows.length ? Math.max(rows[0].value, 1) : 1
  const iw = W - labelW - 56
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' })
  rows.forEach((r, i) => {
    const y0 = padT + i * (rowH + gap)
    const w = Math.max(4, r.value / max * iw)
    const text = loc(r.label)
    const p = el('path', { d: roundedRight(labelW, y0, w, rowH, 4), fill: `var(--funnel-${Math.min(i + 1, 5)})` })
    const share = Math.round(r.value / max * 100)
    p.addEventListener('mousemove', ev => showTip(`${escapeHtml(text)}: <b>${nf.format(r.value)}</b> (${share}%)`, ev.clientX, ev.clientY))
    p.addEventListener('mouseleave', hideTip)
    svg.appendChild(p)
    svg.appendChild(el('text', { x: labelW - 8, y: y0 + rowH / 2 + 4, 'text-anchor': 'end', class: 'blabel' }, text))
    svg.appendChild(el('text', { x: labelW + w + 8, y: y0 + rowH / 2 + 4, class: 'dlabel' }, nf.format(r.value)))
  })
  host.appendChild(svg)
}

function renderChart(host, chart, wide) {
  if (!chart || !chart.rows || !chart.rows.length) return
  const box = document.createElement('div')
  if (chart.type === 'line') renderLine(box, chart)
  else if (chart.type === 'bars-v') renderBarsV(box, chart)
  else if (chart.type === 'bars-h') renderBarsH(box, chart, wide)
  else if (chart.type === 'funnel') renderFunnel(box, chart)
  host.appendChild(box)
}

function renderNav(menu) {
  const nav = document.getElementById('nav')
  const links = []
  for (const section of menu || []) {
    if (section.panel) links.push({ id: section.panel, label: loc(section.label) })
    for (const item of section.items || []) {
      if (item.panel) links.push({ id: item.panel, label: loc(item.label) })
    }
  }
  const available = new Set((lastKpi.sections || []).map(s => s.id))
  nav.innerHTML = links.filter(l => available.has(l.id))
    .map(l => `<a href="#panel-${l.id}">${escapeHtml(l.label)}</a>`).join('')
}

function renderSections(kpi) {
  const host = document.getElementById('sections')
  host.replaceChildren()
  if (!kpi.sections.length) {
    host.innerHTML = `<div class="card wide"><p class="empty">${escapeHtml(t('empty'))}</p></div>`
    return
  }
  for (const section of kpi.sections) {
    const card = document.createElement('div')
    card.className = 'card' + (section.wide ? ' wide' : '')
    card.id = 'panel-' + section.id
    const path = document.createElement('p')
    path.className = 'path'
    path.textContent = loc(section.path)
    const h2 = document.createElement('h2')
    h2.textContent = loc(section.title)
    const hint = document.createElement('p')
    hint.className = 'hint'
    hint.textContent = loc(section.hint)
    card.append(path, h2, hint)
    renderTiles(card, section.tiles)
    renderChart(card, section.chart, section.wide)
    renderTable(card, section.table)
    host.appendChild(card)
  }
}

function renderAll() {
  if (!lastKpi) return
  nf = new Intl.NumberFormat(locale())
  CURRENCY = lastKpi.currency || 'EUR'
  document.documentElement.lang = LANG
  document.title = t('title')
  const company = lastKpi.company && !/^go\s*crm$/i.test(lastKpi.company.trim()) ? lastKpi.company : null
  document.getElementById('title').textContent = company ? company + ' — ' + t('title') : t('title')
  document.getElementById('lang').textContent = t('langBtn')
  document.getElementById('install').textContent = t('install')
  const badge = document.getElementById('badge')
  const when = new Date(lastKpi.generatedAt).toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' })
  badge.textContent = lastLive ? t('live') : (lastGoodAt ? t('offline') + ' ' + when : t('demo'))
  badge.className = 'badge' + (lastLive ? ' live' : '')
  document.getElementById('sub').textContent =
    t('sub') + ' · ' + t('updated') + ' ' + when + ' · ' + t('auto').replace('{s}', REFRESH_SECONDS)
  renderSections(lastKpi)
  renderNav(lastKpi.menu)
}

const DEMO = {
  generatedAt: new Date().toISOString(),
  currency: 'EUR',
  company: null,
  menu: [{ id: 'contabilitate', label: { ro: '🧾 Contabilitate', ru: '🧾 Бухгалтерия' }, items: [{ id: 'clienti', label: { ro: '👥 Chiriași', ru: '👥 Арендаторы' }, panel: 'chiriasi' }], panel: null }],
  sections: [{
    id: 'chiriasi', menuId: 'contabilitate.clienti',
    path: { ro: '🧾 Contabilitate → 👥 Chiriași', ru: '🧾 Бухгалтерия → 👥 Арендаторы' },
    title: { ro: 'Chiriași', ru: 'Арендаторы' },
    hint: { ro: 'Portofoliul de chiriași · situația curentă', ru: 'Портфель арендаторов · текущее состояние' },
    wide: false,
    tiles: [
      { label: { ro: 'Chiriași activi', ru: 'Активные арендаторы' }, value: 38, fmt: 'int' },
      { label: { ro: 'Chirie contractată · lunar', ru: 'Законтрактованная аренда · в месяц' }, value: 41200, fmt: 'money' }
    ],
    chart: { type: 'bars-h', fmt: 'money', rows: [
      { label: 'Alfa Construct', value: 3200 }, { label: 'Beta Logistic', value: 2800 },
      { label: 'Gamma Print', value: 2100 }, { label: 'Delta Auto', value: 1750 }
    ]},
    table: { head: [{ ro: 'Chiriaș', ru: 'Арендатор' }, { ro: 'Chirie (EUR)', ru: 'Аренда (EUR)' }], rows: [
      ['Alfa Construct', { v: 3200, fmt: 'money' }], ['Beta Logistic', { v: 2800, fmt: 'money' }]
    ]}
  }]
}

const REFRESH_SECONDS = Math.max(15, Number(params.get('refresh')) || 60)
const API = 'api' + location.search

async function load() {
  try {
    const res = await fetch(API, { cache: 'no-store' })
    if (!res.ok) throw new Error('http ' + res.status)
    lastKpi = await res.json()
    lastLive = true
    lastGoodAt = Date.now()
  } catch {
    if (!lastKpi) { lastKpi = DEMO; lastLive = false }
    else lastLive = false
  }
  renderAll()
}

document.getElementById('lang').addEventListener('click', () => {
  LANG = LANG === 'ro' ? 'ru' : 'ro'
  try { localStorage.setItem('gocrm_lang', LANG) } catch {}
  renderAll()
})

const themeBtn = document.getElementById('theme')
let theme = 'auto'
try { theme = localStorage.getItem('gocrm_theme') || 'auto' } catch {}
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme')
  else document.documentElement.setAttribute('data-theme', theme)
  themeBtn.textContent = theme === 'auto' ? t('themeAuto') : theme === 'light' ? t('themeLight') : t('themeDark')
}
themeBtn.addEventListener('click', () => {
  theme = theme === 'auto' ? 'light' : theme === 'light' ? 'dark' : 'auto'
  try { localStorage.setItem('gocrm_theme', theme) } catch {}
  applyTheme()
})
applyTheme()

document.getElementById('refresh-now').addEventListener('click', load)

const manifest = document.createElement('link')
manifest.rel = 'manifest'
manifest.href = 'manifest.webmanifest' + location.search
document.head.appendChild(manifest)

let deferredPrompt = null
const installBtn = document.getElementById('install')
window.addEventListener('beforeinstallprompt', ev => {
  ev.preventDefault()
  deferredPrompt = ev
  installBtn.hidden = false
})
installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return
  deferredPrompt.prompt()
  await deferredPrompt.userChoice
  deferredPrompt = null
  installBtn.hidden = true
})
window.addEventListener('appinstalled', () => { installBtn.hidden = true })

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {})
}

load()
setInterval(load, REFRESH_SECONDS * 1000)
</script>
